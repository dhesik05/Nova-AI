<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Pulsing rings -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="#DC2626" stroke-width="1" stroke-opacity="0.15">
    <animate attributeName="r" values="45;55;45" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.08;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.2">
    <animate attributeName="r" values="38;48;38" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Background disc -->
  <circle cx="60" cy="60" r="38" fill="white" stroke="#F3F4F6" stroke-width="1"/>
  <circle cx="60" cy="60" r="38" fill="url(#pulse-grad)"/>

  <!-- D letterform (centered) -->
  <path d="M36 36 H54 C68 36 76 46 76 60 C76 74 68 84 54 84 H36 Z"
        fill="url(#grad)"/>
  <!-- Inner D cutout -->
  <path d="M44 44 H52 C63 44 67 51 67 60 C67 69 63 76 52 76 H44 Z"
        fill="white"/>

  <!-- AI node dots with pulse -->
  <circle cx="82" cy="38" r="4" fill="#EF4444" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="52" r="2.5" fill="#DC2626" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="86" cy="30" r="2" fill="#EF4444" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.6s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <!-- Connecting lines -->
  <line x1="82" y1="38" x2="90" y2="52" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="82" y1="38" x2="86" y2="30" stroke="#DC2626" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
</svg>
