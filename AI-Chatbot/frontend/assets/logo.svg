<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#DC2626" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- White rounded background -->
  <rect width="64" height="64" rx="16" fill="white"/>

  <!-- Subtle brand glow -->
  <rect width="64" height="64" rx="16" fill="url(#grad-glow)"/>

  <!-- Main D shape -->
  <g filter="url(#shadow)">
    <path d="M14 14 H28 C42 14 50 22 50 32 C50 42 42 50 28 50 H14 Z"
          fill="url(#grad-main)" rx="4"/>
    <!-- Inner cutout to form D -->
    <path d="M20 21 H27 C37 21 43 26 43 32 C43 38 37 43 27 43 H20 Z"
          fill="white"/>
  </g>

  <!-- AI circuit nodes -->
  <circle cx="48" cy="16" r="3" fill="#EF4444" opacity="0.9"/>
  <circle cx="54" cy="24" r="2" fill="#DC2626" opacity="0.7"/>
  <circle cx="52" cy="10" r="1.5" fill="#EF4444" opacity="0.6"/>

  <!-- Connecting lines -->
  <line x1="48" y1="16" x2="54" y2="24" stroke="#EF4444" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="48" y1="16" x2="52" y2="10" stroke="#DC2626" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>
</svg>
