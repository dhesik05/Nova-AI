<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#DC2626" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- White rounded background -->
  <rect width="64" height="64" rx="16" fill="white"/>

  <!-- Subtle brand glow -->
  <rect width="64" height="64" rx="16" fill="url(#grad-glow)"/>

  <!-- Main N shape -->
  <g filter="url(#shadow)">
    <path d="M15 48 V16 H23 L41 38 V16 H49 V48 H41 L23 26 V48 Z"
          fill="url(#grad-main)"/>
  </g>

  <!-- AI circuit / constellation nodes -->
  <circle cx="52" cy="14" r="3" fill="#EF4444" opacity="0.9"/>
  <circle cx="57" cy="22" r="2" fill="#DC2626" opacity="0.75"/>
  <circle cx="55" cy="8" r="1.5" fill="#EF4444" opacity="0.6"/>

  <!-- Connecting lines -->
  <line x1="52" y1="14" x2="57" y2="22" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="52" y1="14" x2="55" y2="8" stroke="#DC2626" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
</svg>
