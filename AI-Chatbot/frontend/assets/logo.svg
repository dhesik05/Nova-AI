<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crisp white rounded container -->
  <rect width="64" height="64" rx="16" fill="#FFFFFF"/>

  <!-- Subtle brand purple glow -->
  <rect width="64" height="64" rx="16" fill="url(#grad-glow)"/>

  <!-- Main N letterform -->
  <g filter="url(#shadow)">
    <path d="M15 48 V16 H23 L41 38 V16 H49 V48 H41 L23 26 V48 Z"
          fill="url(#grad-main)"/>
  </g>

  <!-- AI circuit / constellation nodes -->
  <circle cx="52" cy="14" r="3" fill="#A855F7" opacity="0.95"/>
  <circle cx="57" cy="22" r="2" fill="#7C3AED" opacity="0.8"/>
  <circle cx="55" cy="8" r="1.5" fill="#8B5CF6" opacity="0.7"/>

  <!-- Connecting lines -->
  <line x1="52" y1="14" x2="57" y2="22" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="52" y1="14" x2="55" y2="8" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
</svg>
